<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AulaLengua · 5.º Primaria CLM (Standalone)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .card { transition: all 0.2s ease; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.1); }
    .nav-active { background: linear-gradient(135deg, #1e40af, #0ea5e9); color: white !important; }
    .badge-min { background: #dcfce7; color: #166534; }
    .badge-pending { background: #fef3c7; color: #92400e; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div class="flex min-h-screen">
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col fixed h-full z-20 shadow-sm">
      <div class="p-5 border-b">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-700 to-sky-500 flex items-center justify-center text-white font-bold text-lg">AL</div>
          <div>
            <h1 class="font-bold text-lg leading-tight">AulaLengua</h1>
            <p class="text-xs text-slate-500">5.º Primaria · CLM · Standalone</p>
          </div>
        </div>
      </div>
      <nav class="flex-1 p-3 space-y-1" id="nav">
        <button data-view="home" class="nav-btn w-full text-left px-4 py-2.5 rounded-lg flex items-center gap-3 nav-active text-sm"><i class="fas fa-home w-5"></i> Inicio</button>
        <button data-view="books" class="nav-btn w-full text-left px-4 py-2.5 rounded-lg flex items-center gap-3 hover:bg-slate-100 text-sm"><i class="fas fa-book w-5"></i> Mis libros SM</button>
        <button data-view="units" class="nav-btn w-full text-left px-4 py-2.5 rounded-lg flex items-center gap-3 hover:bg-slate-100 text-sm"><i class="fas fa-layer-group w-5"></i> Unidades</button>
        <button data-view="bank" class="nav-btn w-full text-left px-4 py-2.5 rounded-lg flex items-center gap-3 hover:bg-slate-100 text-sm"><i class="fas fa-database w-5"></i> Banco de ejercicios</button>
        <button data-view="curriculum" class="nav-btn w-full text-left px-4 py-2.5 rounded-lg flex items-center gap-3 hover:bg-slate-100 text-sm"><i class="fas fa-balance-scale w-5"></i> Criterios</button>
        <button data-view="create" class="nav-btn w-full text-left px-4 py-2.5 rounded-lg flex items-center gap-3 hover:bg-slate-100 text-sm"><i class="fas fa-file-alt w-5"></i> Crear examen</button>
        <button data-view="exams" class="nav-btn w-full text-left px-4 py-2.5 rounded-lg flex items-center gap-3 hover:bg-slate-100 text-sm"><i class="fas fa-folder-open w-5"></i> Mis exámenes</button>
        <button data-view="config" class="nav-btn w-full text-left px-4 py-2.5 rounded-lg flex items-center gap-3 hover:bg-slate-100 text-sm"><i class="fas fa-cog w-5"></i> Configuración</button>
      </nav>
      <div class="p-4 border-t text-xs text-slate-500">
        Decreto 81/2022 · LOMLOE<br>Versión standalone (sin servidor)
      </div>
    </aside>

    <main class="flex-1 ml-64 p-6 md:p-8">
      <div id="content"></div>
    </main>
  </div>

  <script>
    // DATOS EMBEBIDOS (versión reducida para compatibilidad)
    alert('Esta es una versión temporal. El archivo completo se está subiendo. Por favor, descarga el archivo original o espera la actualización completa.');
    document.getElementById('content').innerHTML = '<div class="p-8"><h2 class="text-2xl font-bold mb-4">AulaLengua</h2><p>Aplicación docente para 5.º de Primaria - Lengua Castellana (Castilla-La Mancha).</p><p class="mt-4 text-slate-600">El archivo completo está en proceso de subida. Mientras tanto, puedes usar la versión local si la tienes.</p></div>';
  </script>

</html>
